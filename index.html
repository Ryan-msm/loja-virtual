<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lojas Quase Tudo - E-commerce de Hardware</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- BARRA DE ACESSIBILIDADE -->
  <header class="accessibility-bar">
    <div class="container accessibility-content">
      <span>Ferramentas de Acessibilidade:</span>
      <div class="accessibility-buttons">
        <button id="btnFontIncrease" class="button small" aria-label="Aumentar Fonte">A+</button>
        <button id="btnFontDecrease" class="button small" aria-label="Diminuir Fonte">A-</button>
        <button id="btnFontReset" class="button small" aria-label="Restaurar Fonte">Padrão</button>
        <button id="btnContrast" class="button small">Alto Contraste</button>
        <button id="btnColorblind" class="button small">Modo Daltónico</button>
      </div>
    </div>
  </header>

  <!-- NAVBAR PRINCIPAL -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="#" class="logo">Lojas Quase Tudo (Menos Juízo)</a>
      <div class="nav-actions">
        <button class="button outline" onclick="LQT.openCart()">
          🛒 Carrinho (<span id="cartBadge">0</span>)
        </button>
        <button class="button outline" onclick="LQT.resetDemo()" title="Restaurar dados originais">
          🔄 Resetar
        </button>
      </div>
    </div>
  </nav>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="container main-content">
    
    <!-- BARRA DE FILTROS E BUSCA -->
    <section class="filters-section">
      <input type="text" id="searchInput" placeholder="Pesquisar componentes (Ex: Memória, SSD, Placa)..." class="search-input">
      
      <select id="categoryFilter" class="select-input">
        <option value="">Todas as Categorias</option>
        <option value="Memórias RAM">Memórias RAM</option>
        <option value="SSDs">SSDs</option>
        <option value="Placas de Vídeo">Placas de Vídeo</option>
        <option value="Processadores">Processadores</option>
        <option value="Placas-Mãe">Placas-Mãe</option>
        <option value="Monitores">Monitores</option>
      </select>

      <select id="sortFilter" class="select-input">
        <option value="">Ordenar por...</option>
        <option value="low">Menor Preço</option>
        <option value="high">Maior Preço</option>
        <option value="name">Nome (A-Z)</option>
      </select>
    </section>

    <!-- CATÁLOGO DE PRODUTOS -->
    <section>
      <h2>Catálogo de Hardware</h2>
      <div id="productGrid" class="product-grid">
        <!-- O script.js injeta os produtos aqui dinamicamente -->
      </div>
    </section>

  </main>

  <!-- DRAWER DO CARRINHO -->
  <div id="cartDrawer" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Seu Carrinho de Compras</h3>
        <button class="button small" onclick="LQT.closeModal('#cartDrawer')">✕</button>
      </div>
      <div id="cartItems" class="modal-body">
        <!-- Itens do carrinho -->
      </div>
      <div class="modal-footer" style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px;">
        <div style="margin-bottom: 10px; display:flex; gap:10px;">
          <input type="text" id="couponInput" placeholder="Cupom (UNIVERSIDADE10)" class="search-input" style="flex:1;">
          <button class="button outline" onclick="LQT.applyCoupon()">Aplicar</button>
        </div>
        <div style="font-size: 1.1rem; font-weight: bold; margin-bottom: 15px;">
          Subtotal: <span id="cartSubtotal">R$ 0,00</span>
        </div>
        
        <!-- FORMULÁRIO DE CHECKOUT -->
        <form id="checkoutForm" style="display:flex; flex-direction:column; gap:10px;">
          <input type="text" id="customerName" placeholder="Seu Nome Completo" required class="search-input">
          <input type="email" id="customerEmail" placeholder="Seu E-mail" required class="search-input">
          <input type="text" id="customerPhone" placeholder="Seu WhatsApp (Ex: 65999998888)" class="search-input">
          <input type="text" id="customerAddress" placeholder="Endereço de Entrega" required class="search-input">
          <button type="submit" class="button primary" style="width:100%; margin-top:5px;">Finalizar Compra Simulado</button>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL DE SUCESSO -->
  <div id="successModal" class="modal-overlay">
    <div class="modal-card" id="successContent">
      <!-- Conteúdo injetado via JS -->
    </div>
  </div>

  <!-- CONTAINER DE TOASTS -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- SCRIPT PRINCIPAL -->
  <script src="script.js"></script>
</body>
</html>
